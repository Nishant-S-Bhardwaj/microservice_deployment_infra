image:
  repository: nishantbhardwaj/microservices-deployment
  pullPolicy: IfNotPresent
  pullSecrets: []

services:
  - name: user
    tag: user
    nodePort: 30002
  - name: route
    tag: route
    nodePort: 30003
  - name: rider
    tag: rider
    nodePort: 30004
  - name: payment
    tag: payment
    nodePort: 30005

containerPort: 3000
replicaCount: 1

database:
  name: uber
  host: postgres
  port: 5432
  authSecret: uber-postgres-auth

rabbitmq:
  host: rabbitmq
  port: 5672
  authSecret: uber-rabbitmq-auth

jwtSecret: uber-app-auth
