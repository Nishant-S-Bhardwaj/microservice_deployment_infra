apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uber-user
  namespace: uber
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: user
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uber-rider
  namespace: uber
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /user(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: user
                port:
                  number: 3000
          - path: /rider(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: rider
                port:
                  number: 3000
          - path: /route(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: route
                port:
                  number: 3000
          - path: /payment(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: payment
                port:
                  number: 3000
