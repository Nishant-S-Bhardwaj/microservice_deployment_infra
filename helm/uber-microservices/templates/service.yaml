{{- range .Values.services }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/part-of: uber
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: {{ .name }}
  ports:
    - name: http
      port: {{ $.Values.containerPort }}
      targetPort: http
      protocol: TCP
      nodePort: {{ .nodePort }}
---
{{ end }}
