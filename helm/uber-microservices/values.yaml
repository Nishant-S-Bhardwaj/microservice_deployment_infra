image:
  repository: nishantbhardwaj/microservices-deployment
  pullPolicy: Always
  pullSecrets: []

services:
  - name: user
    tag: user
  - name: route
    tag: route
  - name: rider
    tag: rider
  - name: payment
    tag: payment

containerPort: 3000
replicaCount: 1

database:
  name: uber
  host: postgres
  port: 5432
  authSecret: uber-postgres-auth

rabbitmq:
  host: rabbitmq
  port: 5672
  authSecret: uber-rabbitmq-auth

jwtSecret: uber-app-auth
demoAuthDisabled: true

ui:
  tag: ui
  port: 80
