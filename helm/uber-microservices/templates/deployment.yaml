{{- range .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/part-of: uber
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .name }}
        app.kubernetes.io/part-of: uber
    spec:
      nodeSelector:
        workload: app
      imagePullSecrets:
        {{- toYaml $.Values.image.pullSecrets | nindent 8 }}
      containers:
        - name: {{ .name }}
          image: "{{ $.Values.image.repository }}:{{ .tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $.Values.containerPort }}
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: {{ $.Values.database.name | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.database.authSecret }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.database.authSecret }}
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ $.Values.database.host }}:{{ $.Values.database.port }}/{{ $.Values.database.name }}"
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.rabbitmq.authSecret }}
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.rabbitmq.authSecret }}
                  key: RABBITMQ_DEFAULT_PASS
            - name: AMQP_URL
              value: "amqp://$(RABBITMQ_DEFAULT_USER):$(RABBITMQ_DEFAULT_PASS)@{{ $.Values.rabbitmq.host }}:{{ $.Values.rabbitmq.port }}"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.jwtSecret }}
                  key: JWT_SECRET
            {{ if or (eq .name "user") (eq .name "rider") }}
            - name: DEMO_AUTH_DISABLED
              value: {{ $.Values.demoAuthDisabled | quote }}
            {{ end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
---
{{ end }}
