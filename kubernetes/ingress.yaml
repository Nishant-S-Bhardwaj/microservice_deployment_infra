apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uber-ui
  namespace: uber
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /rider
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uber-api
  namespace: uber
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/user(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: user
                port:
                  number: 3000
          - path: /api/rider(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: rider
                port:
                  number: 3000
